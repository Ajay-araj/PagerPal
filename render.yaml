services:
  - type: web
    name: pagerpal-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: SIMULATION
      - key: FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      # If using Render Starter with Persistent Disk, uncomment disk and set DATABASE_PATH:
      # - key: DATABASE_PATH
      #   value: /data/pagerpal.db
    # disk:
    #   name: pagerpal-data
    #   mountPath: /data
    #   sizeGB: 1
